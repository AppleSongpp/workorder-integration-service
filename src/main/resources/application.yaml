spring:
  application:
    name: workorder-integration-service
  datasource:
    # File-based H2: data (work orders, idempotency keys, outbox) survives restarts.
    # LOCK_TIMEOUT: how long a concurrent request with the same idempotency key waits
    # for the first one to commit before giving up with 409 REQUEST_IN_PROGRESS.
    url: jdbc:h2:file:./data/workorders;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        # Without this a JSON number is read as an enum position: {"sourceSystem": 0} would
        # create an SDP work order and {"status": 2} would complete one.
        fail-on-numbers-for-enums: true

server:
  error:
    include-message: never
    include-stacktrace: never

workorders:
  security:
    # Every accepted token must carry this audience.
    audience: api://workorders
    # Trusted issuers. Locally these are simulated: tokens are signed by the dev token
    # generator (see README) and verified with the matching public key. For a real IdP,
    # replace public-key-location with jwk-set-uri (see DESIGN.md §3).
    issuers:
      okta:
        issuer-uri: https://okta.local.test/oauth2/workorders
        public-key-location: file:./dev-keys/okta-public.pem
        permissions-claim: scp
      entra:
        issuer-uri: https://login.local.test/entra-tenant/v2.0
        public-key-location: file:./dev-keys/entra-public.pem
        permissions-claim: roles
  idempotency:
    # ISO-8601 durations
    retention: PT24H
    purge-interval: PT15M
